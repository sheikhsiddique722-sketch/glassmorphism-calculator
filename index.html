<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating background lights -->
  <div class="bg-lights">
    <span class="light light-1"></span>
    <span class="light light-2"></span>
    <span class="light light-3"></span>
    <span class="light light-4"></span>
  </div>

  <!-- Calculator container -->
  <main class="calculator" role="application" aria-label="Calculator">

    <header class="calc-header">
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="title">Calculator</p>
    </header>

    <!-- Display -->
    <section class="display" aria-live="polite">
      <div class="history" id="history">&nbsp;</div>
      <div class="result" id="result">0</div>
    </section>

    <!-- Buttons -->
    <section class="buttons">
      <button class="btn func" data-action="clear">AC</button>
      <button class="btn func" data-action="delete">⌫</button>
      <button class="btn func" data-action="percent">%</button>
      <button class="btn operator" data-action="operator" data-value="÷">÷</button>

      <button class="btn" data-action="number" data-value="7">7</button>
      <button class="btn" data-action="number" data-value="8">8</button>
      <button class="btn" data-action="number" data-value="9">9</button>
      <button class="btn operator" data-action="operator" data-value="×">×</button>

      <button class="btn" data-action="number" data-value="4">4</button>
      <button class="btn" data-action="number" data-value="5">5</button>
      <button class="btn" data-action="number" data-value="6">6</button>
      <button class="btn operator" data-action="operator" data-value="−">−</button>

      <button class="btn" data-action="number" data-value="1">1</button>
      <button class="btn" data-action="number" data-value="2">2</button>
      <button class="btn" data-action="number" data-value="3">3</button>
      <button class="btn operator" data-action="operator" data-value="+">+</button>

      <button class="btn zero" data-action="number" data-value="0">0</button>
      <button class="btn" data-action="decimal">.</button>
      <button class="btn equals" data-action="equals">=</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
